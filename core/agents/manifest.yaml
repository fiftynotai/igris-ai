# .claude/agents/manifest.yaml
# DEPRECATED: Agent definitions have moved to native .claude/agents/*.md files.
# This file is kept for reference only. The source of truth is now the individual
# agent definition files (architect.md, forger.md, sentinel.md, etc.)
#
# IGRIS v7.0 Agent Ecosystem Registry (REFERENCE ONLY)

version: "7.0"
schema: "https://igris.ai/schemas/agent-manifest.yaml"

metadata:
  name: "IGRIS Agent Ecosystem"
  description: "Agent definitions for IGRIS v7.0 - 9 agents across 4 tiers"
  created: "2025-12-03"
  updated: "2026-02-13"
  agent_count: 9

tiers:
  1:
    name: "Core Workflow"
    description: "Essential agents for development workflow"
    required: true
  3:
    name: "Maintenance"
    description: "Agents for debugging and self-healing"
    required: false
  4:
    name: "Research"
    description: "Agents for codebase exploration"
    required: false
  5:
    name: "Custom"
    description: "User-defined agents"
    required: false

agents:
  # Tier 1: Core Workflow
  - name: architect
    file: architect.md
    tier: 1
    role: "Implementation planning"
    description: "Creates detailed implementation plans from briefs"
    tools:
      - Read
      - Grep
      - Glob
    triggers:
      - "plan"
      - "design"
      - "architect"
      - "analyze"

  - name: forger
    file: forger.md
    tier: 1
    role: "Code implementation"
    description: "Writes clean, tested code from plans"
    tools:
      - Read
      - Write
      - Edit
      - Bash
      - Grep
      - Glob
    triggers:
      - "implement"
      - "code"
      - "build"
      - "fix"
      - "write"

  - name: sentinel
    file: sentinel.md
    tier: 1
    role: "Test execution"
    description: "Runs tests and validates implementations"
    tools:
      - Read
      - Bash
      - Grep
    triggers:
      - "test"
      - "validate"
      - "verify"
      - "check"

  - name: warden
    file: warden.md
    tier: 1
    role: "Code review + auditing"
    description: "Reviews code for quality and security. Also performs audit operations."
    tools:
      - Read
      - Grep
      - Glob
    triggers:
      - "review"
      - "audit"
      - "inspect"

  - name: aegis
    file: aegis.md
    tier: 1
    role: "Security review and threat analysis"
    description: "Finds vulnerabilities, models threats, and audits code/dependencies for defensive hardening"
    tools:
      - Read
      - Write
      - Edit
      - Bash
      - Grep
      - Glob
    triggers:
      - "security"
      - "threat model"
      - "vulnerability"
      - "audit"
      - "aegis"

  - name: scribe
    file: scribe.md
    tier: 1
    role: "Documentation"
    description: "Writes and maintains READMEs, API references, architecture docs, and code comments"
    tools:
      - Read
      - Write
      - Edit
      - Grep
      - Glob
    triggers:
      - "docs"
      - "documentation"
      - "README"
      - "API reference"
      - "scribe"

  # Tier 3: Maintenance
  - name: mender
    file: mender.md
    tier: 3
    role: "Error recovery"
    description: "Diagnoses errors and suggests fixes"
    tools:
      - Read
      - Grep
      - Glob
      - Bash
    triggers:
      - "debug"
      - "diagnose"
      - "why failed"
      - "fix error"
      - "mender"

  # Tier 4: Research
  - name: seeker
    file: seeker.md
    tier: 4
    role: "Codebase research"
    description: "Investigates and explains codebase"
    tools:
      - Read
      - Grep
      - Glob
      - Bash
    triggers:
      - "explore"
      - "research"
      - "how does"
      - "explain"
      - "find"
      - "seeker"

  # Tier 5: Custom (user-defined; via 'igris add agent')
  # User-defined agents registered here

  - name: sage
    file: sage.md
    tier: 5
    role: "Flutter MVVM + Actions architecture"
    description: "Expert Flutter specialist mastering Kalvad's MVVM + Actions Layer architecture with GetX. Enforces clean layer separation, reactive state, and type-safe patterns."
    tools:
      - Read
      - Write
      - Edit
      - Bash
      - Glob
      - Grep
    triggers:
      - "flutter"
      - "mvvm"
      - "actions layer"
      - "getx"
      - "kalvad"
      - "sage"
      - "dart"
      - "widget"

background_image:
  path: crimson_agumon.jpg
  opacity: 20
terminal_colors:
  normal:
    black: '#161617'
    red: '#960E29'
    green: '#00BA33'
    yellow: '#F7A100'
    blue: '#960E29'
    magenta: '#B31337'
    cyan: '#B31337'
    white: '#E5E5E7'
  bright:
    black: '#2C2C2E'
    red: '#B31337'
    green: '#00BA33'
    yellow: '#F7A100'
    blue: '#B31337'
    magenta: '#B31337'

# Fifty Design Language (FDL) v1.0 - Crimson Theme with Background
# Maintainer: Mohamed Elamin (fifty.dev)
# CRIMSON AGUMON CHARACTER BACKGROUND VERSION
#
# Installation:
# 1. Generate Crimson Agumon image (see CRIMSON_AGUMON_PROMPT.md)
# 2. Save image as: ~/.warp/themes/crimson_agumon.jpg
# 3. Copy this file to: ~/.warp/themes/fdl_crimson_bg.yaml
# 4. Restart Warp
# 5. Settings > Appearance > Theme > "FDL Crimson BG"

name: FDL Crimson BG

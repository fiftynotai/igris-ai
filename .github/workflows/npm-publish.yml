name: Publish CLI to npm

# Trigger on git tags matching v*.*.* (e.g. v7.0.0). The workflow can also
# be invoked manually via `workflow_dispatch` for staging dry-runs.
#
# GATING (MG-014 Risk #3): the publish step is conditional on the
# `NPM_TOKEN` repository secret being set. When the npm org `fiftynotai` is
# not yet registered (or the token has not been deposited), the workflow
# still runs the test gate but skips publish — the workflow lands at the
# v7.0.0 tag but is dormant until secret config completes. To enable:
#
#   1. Register the npm org `fiftynotai` (npmjs.com).
#   2. Generate a publish-scoped automation token.
#   3. Add it to repo secrets as `NPM_TOKEN`.
#   4. Re-run via workflow_dispatch (or push a new tag).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run (e.g. staging dry-run)"
        required: false
        type: string

jobs:
  publish:
    name: Build, test, publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # Required for npm provenance (npm publish --provenance).

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install root dependencies (workspaces)
        run: npm ci

      - name: Install CLI dependencies
        working-directory: cli
        run: npm install

      - name: Build CLI
        working-directory: cli
        run: npm run build

      # BR-068: the bundled igris-brain MCP must spawn without
      # ERR_MODULE_NOT_FOUND. `npm run build` (copy-templates.sh) already
      # vendors node_modules and runs the spawn smoke guard; this explicit
      # step surfaces a guard failure unambiguously in the Actions log
      # rather than burying it inside the build step. TD-426: the SAME script
      # as the build (no inline duplicate to drift), which also asserts the
      # bundle opened its DB inside the guard's mktemp sandbox — the
      # `[brain] db: <path>` boot line — and never the runner's ~/.igris.
      - name: Smoke-test bundled MCP (BR-068 guard, TD-426 sandbox assertion)
        working-directory: cli
        run: bash scripts/smoke-bundled-mcp.sh dist/brain-mcp-server/dist/index.js 15

      # BR-070: the bundled igris-brain MCP must vendor the embeddings
      # backend (@huggingface/transformers) so semantic/vector search works
      # on the public install path. This is a module-RESOLUTION check, not a
      # model-loading call (a real embedding would network-fetch ~23MB of
      # MiniLM weights — slow and flaky in CI). The runtime hybrid guard
      # handles model-load failures; this step only proves the package was
      # vendored into the bundle (and that the BR-070 prune did not regress).
      # This also exercises the ubuntu (linux) per-platform native
      # resolution path for onnxruntime-node / sharp.
      - name: Verify embeddings backend resolves in bundle (BR-070 guard)
        working-directory: cli/dist/brain-mcp-server
        run: |
          if ! node --input-type=module -e 'import.meta.resolve("@huggingface/transformers")'; then
            echo "::error::bundled igris-brain MCP is missing @huggingface/transformers (BR-070 regression)"
            exit 1
          fi
          echo "bundled igris-brain MCP embeddings backend resolves OK"

      - name: Run vitest
        working-directory: cli
        run: npm test

      # The cli/tests/integration/*.bats suite runs in test.yml's `cli-bats`
      # job (wired by TD-303 — before that it ran in no workflow at all, and
      # this comment was aspirational). The publish gate here stays
      # vitest-only to avoid double-booking a second build; a bats failure
      # surfaces upstream on the push/PR that introduced it.

      - name: Inspect tarball contents (sanity)
        working-directory: cli
        run: npm pack --dry-run

      - name: Verify NPM_TOKEN is set
        id: token_check
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN secret is not set — skipping publish step. Configure the secret to enable publishing (see workflow comments)."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.token_check.outputs.has_token == 'true'
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Skipped — publish gated on NPM_TOKEN
        if: steps.token_check.outputs.has_token != 'true'
        run: |
          echo "::notice::Tag built and tested; publish skipped because NPM_TOKEN is unset."
          echo "Set the NPM_TOKEN repo secret and re-run via workflow_dispatch."

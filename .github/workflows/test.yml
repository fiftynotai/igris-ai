name: Test Shell Scripts

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install bats-core (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Install bats-core (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install bats-core

      - name: Verify Python3 installed
        run: |
          python3 --version

      - name: Verify jq installed
        run: |
          jq --version

      - name: Verify git installed
        run: |
          git --version

      - name: Run test suite
        run: |
          # Run test files sequentially to avoid parallel execution issues
          # See: test/README.md for details on known bats parallel execution issue
          for test_file in test/*.test.bash; do
            echo "Running $(basename $test_file)..."
            bats "$test_file" || exit 1
          done

      - name: Check agent-prompt harness drift (FR-135)
        # Belt-and-suspenders behind the pre-commit hook (scripts/git-hooks/
        # pre-commit -> validate_harness_drift.sh). Surfaces drift between the
        # canonical core/agents/*.md prompts and their generated harnesses.
        #
        # HARD step: the wrapper exits 1 on real DRIFTED but exits 0 (with a
        # loud NOTICE) on the gated-codex MISSING-only state. The 7 core agents
        # declare only codex targets, whose .codex/agents/*.toml are not built
        # yet (codex emit gated until FR-138). STOPGAP: FR-138 un-gates codex
        # and must flip MISSING back to fatal in the wrapper.
        run: |
          bash scripts/validate_harness_drift.sh

      - name: Test results summary
        if: always()
        run: |
          echo "Test suite completed"
          echo "OS: ${{ matrix.os }}"
          echo "Note: Tests run sequentially to avoid bats parallel execution issues"

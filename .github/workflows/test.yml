name: Test Shell Scripts

on:
  push:
    branches: [ main, develop ]
  pull_request:
    # TD-303: widened from `[ main ]` to `["**"]`. Previously a PR into
    # `develop` (the default working branch) ran NO tests at all — the shell
    # suite below only gated PRs targeting `main`. `secrets-scan.yml` already
    # uses `["**"]`; this matches it. Side effect (intended): the 2-OS shell
    # matrix now also runs on develop PRs.
    branches: [ "**" ]
  # Allows a manual rehearsal run of either job before making it a required
  # status check in branch protection.
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    # Least privilege: this job only reads the checkout.
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install bats-core (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Install bats-core (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install bats-core

      - name: Set up Python (managed toolchain)
        # TD-434 (2026-08-31): macos-latest's system python3 is PEP 668
        # externally-managed, so the old `pip install --user pyyaml` fallback
        # died with `error: externally-managed-environment` — every macOS run
        # since 27154151180 (2026-06-08, the first run carrying the PyYAML
        # step) failed here in ~17 s. setup-python's toolchain is NOT
        # externally-managed and prepends PATH, so every later `python3`
        # (including scripts/validate_skill_frontmatter_yaml.py via its bats
        # test) resolves to this same interpreter. Ubuntu is kept symmetric
        # on purpose: it happens to preinstall PyYAML today (6.0.1 at run
        # 33388050967) — exactly the image-drift exposure this step removes.
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python3 installed
        run: |
          python3 --version

      - name: Verify PyYAML installed (TD-219 strict-YAML SKILL.md guard)
        # The SKILL.md frontmatter validator (and its bats test) needs PyYAML
        # to run. Without this the bats test would skip silently and the
        # recurrence guard would be a no-op in CI. Installed unconditionally
        # into the managed setup-python env (TD-434 — the old import-or-
        # `--user`-install fallback targeted the system python and hit
        # PEP 668 on macOS).
        run: |
          python3 -m pip install pyyaml
          python3 -c "import yaml, sys; print('PyYAML', yaml.__version__)"

      - name: Verify jq installed
        run: |
          jq --version

      - name: Verify git installed
        run: |
          git --version

      - name: Install gitleaks (TD-159 — so test/secrets_scan.test.bash runs, not skips)
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            brew install gitleaks
          else
            GL=8.30.1
            curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GL}/gitleaks_${GL}_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
            sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          fi
          gitleaks version

      - name: Run test suite
        run: |
          # Run test files sequentially to avoid parallel execution issues
          # See: test/README.md for details on known bats parallel execution issue
          #
          # TD-434 (2026-08-31): the L-552-guarded files (those matching
          # `grep -l "cli/dist/index.js missing" test/*.test.bash`) SKIP here
          # by documented design — this job has no Node build, so cli/dist is
          # absent. Their CI home is the cli-bats job's "Run cli-dist-dependent
          # root suites" step, which runs them against a built cli/dist. Do
          # not add a cli build here (TD-303 recorded the ubuntu-only-build
          # rationale).
          for test_file in test/*.test.bash; do
            echo "Running $(basename $test_file)..."
            bats "$test_file" || exit 1
          done

      # -----------------------------------------------------------------------
      # TD-434 (2026-08-31): the FR-135 "Check agent-prompt harness drift" step
      # was REMOVED from this job — an explicit re-scope, not a silent skip.
      #
      # The step (added 2026-05-21, 3549b0c) had NEVER once executed in CI:
      # every run since then failed earlier in this job. Its first-ever
      # execution (rehearsal run 33402042908) showed it CANNOT pass on a clean
      # runner by design: the gate's fatal surface is machine state a checkout
      # does not have — the project-relative .codex/agents/*.toml harnesses are
      # gitignored (compiled per machine, "9 project-relative harness(es)
      # MISSING"), and the skills-surface re-check delegates to the `igris`
      # CLI (exit 127 here; the matrix job has no Node build BY DESIGN —
      # TD-303's recorded rationale). The drift gate's enforcement point is
      # and remains the pre-commit hook (scripts/git-hooks/pre-commit ->
      # validate_harness_drift.sh) on the machine that owns the compiled
      # state. A CI-meaningful variant (compile-in-CI with IGRIS_CLI pinned
      # to a built dist, then verify) needs the cli build and belongs to a
      # follow-up brief — see the TD-434 report's residuals.
      # -----------------------------------------------------------------------

      - name: Test results summary
        if: always()
        run: |
          echo "Test suite completed"
          echo "OS: ${{ matrix.os }}"
          echo "Note: Tests run sequentially to avoid bats parallel execution issues"

  # ---------------------------------------------------------------------------
  # TD-303 — CLI bats integration suite.
  #
  # WHAT IT GUARDS: the 121 integration contracts under cli/tests/integration/
  # (re-derive, do not trust this numeral — `cd cli && npm run test:bats | grep
  # -c '^ok '`; it read 86 while the suite actually ran 110, and BR-091 took it
  # to 121), including the `init --upgrade` config.json user-data preservation
  # guard (init.bats, "init --upgrade preserves USER.md byte-for-byte and
  # config.json user-data"), the repo-root CLAUDE.md no-enumeration invariant
  # (install-symlinks.bats — MAINTAINING.md row #98's mechanical guard), and the
  # boot lifecycle detect-JSON shape (awaken-verbs.bats — row #80's guard).
  #
  # WHY IT EXISTS: this suite ran in NO workflow. It was enforced only by
  # developer discipline, which is how BR-077 (an FR-235 regression that
  # mutated config.json on `init --upgrade`) reached HEAD despite a test
  # existing that catches it.
  #
  # UBUNTU-ONLY BY DESIGN: the 2-OS matrix stays on the shell suite above. This
  # job exercises the CLI's Node build, which npm-publish.yml already gates on
  # ubuntu only. No test in the suite is skipped — every one of the 121 runs.
  # ---------------------------------------------------------------------------
  cli-bats:
    name: CLI bats integration
    runs-on: ubuntu-latest

    # Least privilege: this job only reads the checkout. Deliberate here —
    # `npm ci` + `npm run build` execute third-party package install scripts
    # (copy-templates.sh runs a nested `npm install` to vendor the brain MCP),
    # and since the PR trigger now covers every base branch this runs on
    # untrusted PR contributions.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        # Parity with npm-publish.yml (node 20). `cache: npm` with no explicit
        # cache-dependency-path keys off the REPO-ROOT lockfile only — the
        # nested brain-mcp-server/package-lock.json is not part of the key.
        # That is sufficient here: the root lockfile covers the workspaces,
        # which is what `npm ci` below installs.
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install sqlite3 CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Verify suite prerequisites
        # The suite shells out to all three. Fail loud on a missing tool
        # rather than letting a test mis-assert against a "command not found".
        run: |
          sqlite3 --version
          shasum -a 256 /dev/null
          python3 --version

      - name: Install bats (pinned)
        # PINNED deliberately. cli/tests/integration/awaken-verbs.bats calls
        # `bats_require_minimum_version 1.5.0`, a function that only exists in
        # bats-core >= 1.7.0 — on an older distro bats that call is a
        # "command not found" and the whole file errors at LOAD, silently
        # taking 9 tests (and MAINTAINING row #80's guard) with it. apt's bats
        # is a moving target this repo does not control, so pin it here.
        run: |
          npm install -g bats@1.11.1
          bats --version

      - name: Install dependencies (workspaces)
        # Root install: /package-lock.json is the only lockfile covering the
        # `cli` workspace (there is no cli/package-lock.json), and workspaces
        # install devDependencies — tarball-zip-slip.bats shells out to
        # `npx vitest`, so cli devDeps are load-bearing.
        run: npm ci

      - name: Build CLI
        # _helpers.bash resolves CLI_DIST by cd-ing into cli/dist; with no
        # build EVERY .bats file fails at load rather than reporting a test
        # failure. Full `npm run build` mirrors npm-publish.yml's proven
        # sequence (it also vendors the brain MCP bundle).
        working-directory: cli
        run: npm run build

      - name: Run cli-dist-dependent root suites (TD-434)
        # The root suite's L-552-guarded files skip in the matrix job (no
        # Node build there by design — see that job's "Run test suite"
        # comment). They run HERE, right after `Build CLI` produced cli/dist —
        # before TD-434 they had NEVER executed in any CI job. The list is
        # DERIVED from the L-552 skip-message needle so a future guarded file
        # auto-joins; the emptiness guard makes a reworded skip message loud
        # instead of silently emptying this leg. MAINTAINING.md maps the
        # needle: rewording the skip message MUST update this grep in the
        # same commit. Measured 2026-08-31 locally: 2 files, 34 tests
        # (12 documented per-test skips, FR-212d class), ~22 s.
        run: |
          files=$(grep -l "cli/dist/index.js missing" test/*.test.bash)
          [ -n "$files" ] || { echo "TD-434 guard: skip-needle derivation matched 0 files"; exit 1; }
          bats $files

      - name: Run CLI bats integration suite
        # Invoke the npm script, never an inlined `bats tests/integration`, so
        # the CI command and the local/sentinel command cannot drift.
        # MAINTAINING.md maps the `test:bats` script name for this reason.
        working-directory: cli
        run: npm run test:bats

      # -----------------------------------------------------------------------
      # FR-238 — CLI vitest suite.
      #
      # WHAT IT GUARDS: every `cli/src/__tests__/*.test.ts` file. Among them the
      # FR-238 dashboard contracts that have no bats arm — the Host-header
      # allowlist and CORS absence, the four endpoints' payload shapes, the four
      # degraded-brain shapes (200 + `degraded`, never a 500), the "routes.ts
      # holds zero SQL" scope assertion, the AC-#4 no-network bundle scan, the
      # TD-276 stale-bundle freshness guard, and the `npm pack` manifest +
      # size-ceiling assertions.
      #
      # WHY IT EXISTS: `cd cli && npm test` ran ONLY in npm-publish.yml, which
      # triggers on version tags. So a cli vitest file was not gated on push or
      # PR at all — a new test could be red for weeks and only surface at
      # release. Same gap class TD-303 closed for the bats suite above and
      # TD-312 closed for brain-mcp-server (the `brain-vitest` job below).
      #
      # PLACED IN THIS JOB DELIBERATELY: `cli-bats` already does `npm ci` +
      # `npm run build`, which is everything the vitest suite needs (several
      # tests assert against `cli/dist/`). The marginal cost is one step.
      # -----------------------------------------------------------------------
      - name: Run CLI vitest suite
        working-directory: cli
        run: npm test

      # -----------------------------------------------------------------------
      # FR-238 — dashboard app typecheck.
      #
      # WHAT IT GUARDS: cli/dashboard/**, the Vite/React app. Its tsconfig.json
      # is isolated from cli/tsconfig.json (the app must not enter `rootDir:
      # ./src`), which means the `tsc` in `npm run build` never sees it.
      #
      # WHY IT EXISTS: `vite build` does NOT typecheck. esbuild strips types
      # without checking them, so a genuine type error compiles clean and ships
      # — verified: an injected `const x: number = "str"` produced
      # `error TS2322` under this script while `vite build` reported
      # "✓ built in 150ms". Without this step the app surface would ship with
      # its typecheck ungated, which is the same gap class the step above
      # closes for the vitest suite.
      # -----------------------------------------------------------------------
      - name: Typecheck dashboard app
        working-directory: cli
        run: npm run typecheck:dashboard

  # ---------------------------------------------------------------------------
  # TD-312 — brain-mcp-server vitest suite.
  #
  # WHAT IT GUARDS: the brain's entire test surface — every vitest file under
  # brain-mcp-server's src|scripts|eval `__tests__` globs (vitest.config.ts):
  # the graph engine, cognition, perception, sync, embeddings guards, and
  # every MCP handler. Measured locally 2026-08-31 at 3d7d59a: 171 files,
  # 2785 passed | 1 skipped, ~36 s — re-derive with
  # `cd brain-mcp-server && npm test`, do not trust these numerals.
  #
  # WHY IT EXISTS: the suite ran in NO workflow — a local-only gate, enforced
  # by developer discipline. Same gap class TD-303 closed for the cli bats
  # suite (after BR-077 escaped through it) and FR-238 closed for the cli
  # vitest suite.
  #
  # DETERMINISM: embeddings are mocked at the utils/embeddings.js seam in
  # every test file that touches them (no HF model fetch — deliberately NO
  # model cache step, so a fetch regression is loud, not masked); engine
  # tests use `:memory:`/mkdtemp DBs; exactly 2 tests self-skip HERE via the
  # documented capability predicate `it.skipIf(!haveDb)` (the graph-traversal
  # "real DB smoke" pair, which needs a live ~/.igris/memory/knowledge.db) —
  # a 3rd skip in this job's log is environment-independent, the
  # RUN_LLM_INTEGRATION=1-gated real-harness smoke (subconscious
  # engine-integration.test.ts), which skips on a dev machine too;
  # the four wall-clock P95 benchmarks stay ARMED under a documented
  # BENCH_SLACK x4 CI headroom factor (graph-traversal.integration.test.ts,
  # TD-312) sized for this 2-core runner.
  # ---------------------------------------------------------------------------
  brain-vitest:
    name: Brain vitest suite
    runs-on: ubuntu-latest

    # Least privilege: this job only reads the checkout. Deliberate here —
    # `npm ci` executes third-party package install scripts (better-sqlite3,
    # sqlite-vec native prebuilds), and the PR trigger covers every base
    # branch, so this runs on untrusted PR contributions.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        # Node "20": parity with the cli-bats and npm-publish.yml pins and
        # with engines `>=20 <27`. Own cache key: the cli-bats job's cache
        # keys off the REPO-ROOT lockfile only (see its setup-node comment);
        # this job installs from the NESTED brain-mcp-server/package-lock.json,
        # so the cache is keyed off that file instead.
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: brain-mcp-server/package-lock.json

      - name: Install dependencies (nested lockfile)
        working-directory: brain-mcp-server
        run: npm ci

      - name: Run brain vitest suite
        # Invoke the npm script, never an inlined `vitest run`, so the CI
        # command and the local/sentinel command cannot drift — the
        # MAINTAINING.md `test:bats` row's rule; the brain `test` script name
        # has its own row there for the same reason.
        working-directory: brain-mcp-server
        run: npm test

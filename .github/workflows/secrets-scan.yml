name: Secret Scan

# Layer 2 of the TD-159 four-layer secret-scanning model (the non-bypassable
# net). Runs the same gitleaks ruleset (.gitleaks.toml) server-side on every
# push to develop/main and every pull request. Layer 1 is the local pre-commit
# hook (bypassable with --no-verify); this workflow is the defense-in-depth that
# a --no-verify cannot escape. Make this a REQUIRED status check on PRs to `main`
# in the repo's branch-protection rules (operator action — cannot be set from a
# workflow file).
#
# WHY: TD-157 — the operator's VPS IP leaked into core/ and survived 5 hunts +
# every other quality gate, caught only by a manual git grep pre-release.
# See docs/operations/secret-scanning.md.

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ "**" ]

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks-action can scan the complete commit range
          # of a push / PR (it diffs against the base by default for PRs and
          # scans the pushed commits for direct pushes). fetch-depth: 0 fetches
          # all history; the action picks the right range per event type.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Use the repo's curated config (custom Igris rules + allowlist) rather
          # than the action's bundled default. Path is relative to the repo root.
          GITLEAKS_CONFIG: .gitleaks.toml
          # GITHUB_TOKEN lets the action post a summary comment on the PR with
          # the leak details (file:line + rule) when a finding blocks the merge.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_ENABLE_UPLOAD_ARTIFACT keeps the SARIF/JSON report as a
          # build artifact for auditability. Off by default to keep logs lean;
          # the per-finding PR comment is the primary surface.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          # No GITLEAKS_LICENSE needed: gitleaks-action is free for individual
          # accounts and public/OSS repos. (Only GitHub *Organizations* on
          # private repos require a license key.)

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IGRIS — System Architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d0a08;--fg:#f6efe6;--accent:#ff5a1f;--deep:#7a2410;--muted:rgba(246,239,230,.55);--line:rgba(246,239,230,.16);--panel:rgba(255,255,255,.025)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);display:flex;justify-content:center;padding:28px}
  svg{width:1700px;height:1330px;display:block}
  svg text{ -webkit-font-smoothing:antialiased }
  .eyebrow{font:500 13px 'JetBrains Mono',monospace;fill:var(--accent);letter-spacing:3px}
  .title{font:400 40px 'Anton',sans-serif;fill:var(--fg);letter-spacing:.5px;text-transform:uppercase}
  .subt{font:italic 400 15px 'Space Grotesk';fill:var(--muted)}
  .band{font:500 12px 'JetBrains Mono',monospace;fill:var(--accent);letter-spacing:2.5px}
  .bandm{font:500 12px 'JetBrains Mono',monospace;fill:var(--muted);letter-spacing:2.5px}
  .key{font:500 14.5px 'JetBrains Mono',monospace;fill:var(--fg)}
  .keyA{font:600 14.5px 'JetBrains Mono',monospace;fill:var(--accent)}
  .keybig{font:400 19px 'Anton',sans-serif;fill:var(--fg);letter-spacing:.4px;text-transform:uppercase}
  .d{font:300 11.5px 'Space Grotesk';fill:var(--muted)}
  .df{font:400 11.5px 'Space Grotesk';fill:var(--fg)}
  .box{fill:var(--panel);stroke:var(--line);stroke-width:1}
  .boxA{fill:rgba(255,90,31,.07);stroke:var(--deep);stroke-width:1.2}
  .region{fill:none;stroke:var(--line);stroke-width:1}
  .regionfill{fill:rgba(255,255,255,.012);stroke:var(--line);stroke-width:1}
  .conn{stroke:rgba(246,239,230,.28);stroke-width:1;fill:none}
  .connA{stroke:var(--accent);stroke-width:1.2;fill:none}
  .dash{stroke-dasharray:5 4}
  .gl{font:500 10.5px 'JetBrains Mono',monospace;fill:var(--muted);letter-spacing:1.5px}
</style>
</head>
<body>
<svg viewBox="0 0 1700 1330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#ff5a1f" stroke-width="1.2"/></marker>
    <marker id="ahm" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="rgba(246,239,230,.4)" stroke-width="1"/></marker>

  <text x="40" y="86" class="title">The Igris OS — full system map</text>
  <text x="40" y="110" class="subt">Model = CPU · Igris = OS · /boot = bootloader · project = mounted volume</text>

    <rect class="box" x="696"  y="160" width="312" height="44"/><text x="712" y="187" class="key">Gemini</text><text x="992" y="187" class="d" text-anchor="end">dynamic-define</text>

    <path class="connA" d="M242,279 L288,279" marker-end="url(#ah)"/>
    <path class="connA" d="M492,279 L538,279" marker-end="url(#ah)"/>
    <path class="connA" d="M742,279 L788,279" marker-end="url(#ah)"/>

  <line class="conn dash" x1="600" y1="430" x2="600" y2="860"/>
  <text x="600" y="430" class="gl" transform="rotate(90 600 430)" style="fill:#ff5a1f">CONTRACT ↔ IMPL</text>

  <rect class="box" x="622" y="670" width="578" height="46"/><text x="638" y="694" class="key">discovery</text><text x="638" y="710" class="d">gen_os_index.sh · scans self-describing parts → generates INDEX</text>

  <path class="conn dash"  d="M578,635 C605,635 600,637 622,637"/>                                   <!-- memory.md ↔ memory -->

  <path class="conn dash"  d="M578,692 C606,692 600,576 622,576"/>                                   <!-- protocol(skills) ↔ verbs -->

    <rect class="box" x="1258" y="476" width="120" height="42"/><text x="1274" y="502" class="key" style="font-size:13px">architect</text>
    <rect class="box" x="1390" y="476" width="120" height="42"/><text x="1406" y="502" class="key" style="font-size:13px">forger</text>

    <rect class="box" x="1258" y="526" width="120" height="42"/><text x="1274" y="552" class="key" style="font-size:13px">warden</text>
    <rect class="box" x="1390" y="526" width="120" height="42"/><text x="1406" y="552" class="key" style="font-size:13px">mender</text>
    <rect class="box" x="1522" y="526" width="120" height="42"/><text x="1538" y="552" class="key" style="font-size:13px">seeker</text>

  <g>
    <rect class="box" x="1258" y="664" width="384" height="40"/>
    <text x="1450" y="689" class="keyA" text-anchor="middle" style="font-size:12.5px">plan → build → test → review → commit</text>
  </g>
  <text x="1258" y="744" class="gl">QUALITY GATES</text>
  <rect class="box" x="1258" y="754" width="384" height="120"/>
  <text x="1274" y="780" class="df">▸ brief-first — no edit without a brief</text>
  <text x="1274" y="804" class="df">▸ phase-guard — no out-of-phase commit</text>
  <text x="1274" y="828" class="df">▸ consumer-sweep — re-point every consumer</text>
  <text x="1274" y="852" class="df">▸ delegation — specialists behind the gates</text>

  <path class="connA" d="M911,716 L911,948" marker-end="url(#ah)"/>
  <text x="922" y="740" class="gl" style="fill:#ff5a1f">backed by ↓</text>

  <!-- domain docs -->

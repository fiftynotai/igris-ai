# .claude/agents/manifest.yaml
# IGRIS v3.2 Agent Ecosystem Registry

version: "3.2"
schema: "https://igris.ai/schemas/agent-manifest.yaml"

metadata:
  name: "IGRIS Agent Ecosystem"
  description: "Subagent definitions for IGRIS v3.2 - 12 agents across 5 tiers"
  created: "2025-12-03"
  updated: "2025-12-03"
  agent_count: 12

tiers:
  1:
    name: "Core Workflow"
    description: "Essential agents for development workflow"
    required: true
  2:
    name: "Documentation"
    description: "Agents for documentation and releases"
    required: false
  3:
    name: "Maintenance"
    description: "Agents for auditing and self-healing"
    required: false
  4:
    name: "Innovation"
    description: "Agents for ideation and exploration"
    required: false
  5:
    name: "Custom"
    description: "User-defined agents"
    required: false

agents:
  # Tier 1: Core Workflow
  - name: planner
    file: planner.md
    tier: 1
    role: "Implementation planning"
    description: "Creates detailed implementation plans from briefs"
    tools:
      - Read
      - Grep
      - Glob
    triggers:
      - "plan"
      - "design"
      - "architect"
      - "analyze"

  - name: coder
    file: coder.md
    tier: 1
    role: "Code implementation"
    description: "Writes clean, tested code from plans"
    tools:
      - Read
      - Write
      - Edit
      - Bash
      - Grep
      - Glob
    triggers:
      - "implement"
      - "code"
      - "build"
      - "fix"
      - "write"

  - name: tester
    file: tester.md
    tier: 1
    role: "Test execution"
    description: "Runs tests and validates implementations"
    tools:
      - Read
      - Bash
      - Grep
    triggers:
      - "test"
      - "validate"
      - "verify"
      - "check"

  - name: reviewer
    file: reviewer.md
    tier: 1
    role: "Code review"
    description: "Reviews code for quality and security"
    tools:
      - Read
      - Grep
      - Glob
    triggers:
      - "review"
      - "audit"
      - "inspect"

  # Tier 2: Documentation
  - name: documenter
    file: documenter.md
    tier: 2
    role: "Documentation"
    description: "Writes and maintains documentation"
    tools:
      - Read
      - Write
      - Grep
      - Glob
    triggers:
      - "document"
      - "update docs"
      - "update readme"
      - "add comments"
      - "chronicle"

  - name: releaser
    file: releaser.md
    tier: 2
    role: "Release preparation"
    description: "Generates changelog and prepares releases"
    tools:
      - Read
      - Write
      - Bash
      - Grep
    triggers:
      - "release"
      - "changelog"
      - "version"
      - "prepare release"
      - "herald"

  - name: standardizer
    file: standardizer.md
    tier: 2
    role: "Standards generation"
    description: "Generates coding_guidelines.md from codebase or base repo analysis. 4 modes supported."
    tools:
      - Read
      - Write
      - Grep
      - Glob
      - Bash
    triggers:
      - "standardize"
      - "generate guidelines"
      - "generate standards"
      - "lawkeeper"

  # Tier 3: Maintenance
  - name: auditor
    file: auditor.md
    tier: 3
    role: "Code analysis"
    description: "Runs 7 audit operations and detects issues. Creates briefs for findings."
    tools:
      - Read
      - Grep
      - Glob
      - Bash
    triggers:
      - "audit"
      - "audit code_quality"
      - "audit bugs"
      - "audit standards"
      - "audit process"
      - "audit dependencies"
      - "audit performance"
      - "audit architecture"
      - "audit full"
      - "inquisitor"

  - name: debugger
    file: debugger.md
    tier: 3
    role: "Error recovery"
    description: "Diagnoses errors and suggests fixes"
    tools:
      - Read
      - Grep
      - Glob
      - Bash
    triggers:
      - "debug"
      - "diagnose"
      - "why failed"
      - "fix error"
      - "mender"

  - name: migrator
    file: migrator.md
    tier: 3
    role: "Migration analysis"
    description: "Analyzes codebases against standards and generates migration briefs and roadmaps"
    tools:
      - Read
      - Grep
      - Glob
      - Bash
    triggers:
      - "migrate"
      - "migrate analyze"
      - "migration analysis"
      - "pathfinder"

  # Tier 4: Innovation
  - name: ideator
    file: ideator.md
    tier: 4
    role: "Feature ideation"
    description: "Brainstorms features and improvements"
    tools:
      - Read
      - Grep
      - Glob
    triggers:
      - "suggest"
      - "brainstorm"
      - "ideate"
      - "what if"
      - "dream"
      - "oracle"

  - name: explorer
    file: explorer.md
    tier: 4
    role: "Codebase research"
    description: "Investigates and explains codebase"
    tools:
      - Read
      - Grep
      - Glob
      - Bash
    triggers:
      - "explore"
      - "research"
      - "how does"
      - "explain"
      - "find"
      - "seeker"

  # Tier 5: Custom (Dynamic via Digivolve)
  # User-defined agents registered here

# .claude/agents/manifest.yaml
# DEPRECATED: Agent definitions have moved to native .claude/agents/*.md files.
# This file is kept for reference only. The source of truth is now the individual
# agent definition files (architect.md, forger.md, sentinel.md, etc.)
#
# IGRIS v3.4 Agent Ecosystem Registry (REFERENCE ONLY)

version: "3.4"
schema: "https://igris.ai/schemas/agent-manifest.yaml"

metadata:
  name: "IGRIS Agent Ecosystem"
  description: "Subagent definitions for IGRIS v3.4 - 7 agents across 4 tiers"
  created: "2025-12-03"
  updated: "2026-02-08"
  agent_count: 7

tiers:
  1:
    name: "Core Workflow"
    description: "Essential agents for development workflow"
    required: true
  3:
    name: "Maintenance"
    description: "Agents for debugging and self-healing"
    required: false
  4:
    name: "Research"
    description: "Agents for codebase exploration"
    required: false
  5:
    name: "Custom"
    description: "User-defined agents"
    required: false

agents:
  # Tier 1: Core Workflow
  - name: planner
    file: planner.md
    tier: 1
    role: "Implementation planning"
    description: "Creates detailed implementation plans from briefs"
    tools:
      - Read
      - Grep
      - Glob
    triggers:
      - "plan"
      - "design"
      - "architect"
      - "analyze"

  - name: coder
    file: coder.md
    tier: 1
    role: "Code implementation"
    description: "Writes clean, tested code from plans"
    tools:
      - Read
      - Write
      - Edit
      - Bash
      - Grep
      - Glob
    triggers:
      - "implement"
      - "code"
      - "build"
      - "fix"
      - "write"

  - name: tester
    file: tester.md
    tier: 1
    role: "Test execution"
    description: "Runs tests and validates implementations"
    tools:
      - Read
      - Bash
      - Grep
    triggers:
      - "test"
      - "validate"
      - "verify"
      - "check"

  - name: reviewer
    file: reviewer.md
    tier: 1
    role: "Code review + auditing"
    description: "Reviews code for quality and security. Also performs audit operations."
    tools:
      - Read
      - Grep
      - Glob
    triggers:
      - "review"
      - "audit"
      - "inspect"

  # Tier 3: Maintenance
  - name: debugger
    file: debugger.md
    tier: 3
    role: "Error recovery"
    description: "Diagnoses errors and suggests fixes"
    tools:
      - Read
      - Grep
      - Glob
      - Bash
    triggers:
      - "debug"
      - "diagnose"
      - "why failed"
      - "fix error"
      - "mender"

  # Tier 4: Research
  - name: explorer
    file: explorer.md
    tier: 4
    role: "Codebase research"
    description: "Investigates and explains codebase"
    tools:
      - Read
      - Grep
      - Glob
      - Bash
    triggers:
      - "explore"
      - "research"
      - "how does"
      - "explain"
      - "find"
      - "seeker"

  # Tier 5: Custom (Dynamic via Digivolve)
  # User-defined agents registered here

  - name: flutter-mvvm-actions-expert
    file: flutter-mvvm-actions-expert.md
    tier: 5
    role: "Flutter MVVM + Actions architecture"
    description: "Expert Flutter specialist mastering Kalvad's MVVM + Actions Layer architecture with GetX. Enforces clean layer separation, reactive state, and type-safe patterns."
    tools:
      - Read
      - Write
      - Edit
      - Bash
      - Glob
      - Grep
    triggers:
      - "flutter"
      - "mvvm"
      - "actions layer"
      - "getx"
      - "kalvad"
      - "sage"
      - "dart"
      - "widget"

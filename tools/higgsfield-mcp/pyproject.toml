[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "higgsfield-mcp"
version = "2.0.0"
description = "MCP server for Higgsfield AI platform - all models, editing tools, and speech"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "higgsfield-client>=0.1.0",
    "httpx>=0.27.0",
]

[project.scripts]
higgsfield-mcp = "higgsfield_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/higgsfield_mcp"]
